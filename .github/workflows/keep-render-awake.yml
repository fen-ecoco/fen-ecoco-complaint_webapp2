name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://ecoco-complaint-analyzer.onrender.com/ >/dev/null
